<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SbayAI</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SbayAI">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Top: Logo + Collapse -->
            <div class="sidebar-top">
                <a href="/" class="sidebar-logo">
                    <img src="/static/logo.svg" alt="Sbay" style="height:36px;width:auto">
                </a>
                <button class="sidebar-collapse" id="sidebarCollapseBtn" title="Thu gọn sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                </button>
            </div>

            <!-- Nav -->
            <div class="sidebar-nav">
                <button class="sidebar-btn" id="newChatBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Đoạn chat mới
                </button>
                <button class="sidebar-btn" id="searchBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Tìm kiếm đoạn chat
                </button>
                <button class="sidebar-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                    Thêm
                </button>
            </div>

            <!-- GPT Section -->
            <div class="sidebar-section-title">
                GPT của tôi
                <button class="gpt-add-btn" id="gptAddBtn" title="Tạo GPT mới">+</button>
            </div>
            <div class="sidebar-gpt-list" id="gptList"><!-- render boi MyGpts --></div>

            <div class="sidebar-divider"></div>

            <!-- Conversations -->
            <div class="conversation-list" id="conversationList"></div>

            <!-- Footer -->
            <div class="sidebar-footer">
                <div class="user-profile" id="userProfileBtn">
                    <div class="user-avatar" id="userAvatarEl">NG</div>
                    <div class="user-info">
                        <div class="user-name" id="userNameEl">nguyenthetrinhsbay</div>
                        <div class="user-plan" id="userPlanEl">Tài khoản cá nhân</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <!-- Header -->
            <div class="main-header">
                <button class="model-selector" id="modelSelector">
                    SbayAI
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="header-actions">
                    <button class="header-btn" id="shareBtn" title="Thêm người">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    </button>
                    <button class="header-btn" id="settingsBtn" title="Cài đặt">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="8" r="1" fill="currentColor"/><circle cx="8" cy="14" r="1" fill="currentColor"/><circle cx="16" cy="14" r="1" fill="currentColor"/></svg>
                    </button>
                </div>
            </div>

            <!-- Mobile header -->
            <div class="mobile-header" id="mobileHeader">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span class="mobile-title">SbayAI</span>
            </div>

            <!-- Chat -->
            <div class="chat-area" id="chatArea">
                <div class="welcome" id="welcome">
                    <h1>Khi bạn sẵn sàng là chúng ta có thể bắt đầu.</h1>
                </div>
            </div>

            <!-- Input -->
            <div class="input-area">
                <div class="input-wrapper">
                    <button class="attach-btn" id="attachBtn" title="Đính kèm tệp">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <textarea id="messageInput" placeholder="Hỏi bất kỳ điều gì" rows="1" autofocus></textarea>
                    <div class="input-actions">
                        <!-- Nút mic: chỉ chuyển giọng nói → text -->
                        <button class="mic-btn" id="micBtn" title="Chuyển giọng nói thành văn bản">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        </button>
                        <!-- Nút thoại: nói chuyện 2 chiều (nói → AI nghe → AI trả lời → AI đọc → mic tự bật lại) -->
                        <button class="voice-btn" id="voiceBtn" title="Nói chuyện 2 chiều">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="10" width="3" height="4" rx="1.5"/><rect x="7" y="6" width="3" height="12" rx="1.5"/><rect x="12" y="8" width="3" height="8" rx="1.5"/><rect x="17" y="4" width="3" height="16" rx="1.5"/></svg>
                        </button>
                        <!-- Nút gửi (ẩn khi trống, hiện khi có text) -->
                        <button class="send-btn" id="sendBtn" style="display:none">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </div>
                <!-- Quick mode buttons -->
                <div class="quick-modes" id="quickModes">
                    <button class="mode-btn" data-mode="ask" title="Hỏi sâu cho đến khi hiểu 100%">
                        <span class="mode-icon">❓</span> Ask
                    </button>
                    <button class="mode-btn" data-mode="plan" title="Lập kế hoạch chi tiết">
                        <span class="mode-icon">📋</span> Plan
                    </button>
                    <button class="mode-btn" data-mode="idea" title="Brainstorm ý tưởng">
                        <span class="mode-icon">💡</span> Idea
                    </button>
                    <button class="mode-btn" data-mode="fast" title="Trả lời nhanh gọn 1-2-3">
                        <span class="mode-icon">⚡</span> Fast
                    </button>
                    <button class="mode-btn" data-mode="content" title="Soạn content marketing">
                        <span class="mode-icon">✍️</span> Content
                    </button>
                    <button class="mode-btn" data-mode="prompt" title="Soạn câu lệnh AI">
                        <span class="mode-icon">🎯</span> Prompt
                    </button>
                    <button class="mode-btn" data-mode="ceo" title="Tư vấn chiến lược CEO">
                        <span class="mode-icon">👔</span> CEO
                    </button>
                    <button class="mode-btn" data-mode="teacher" title="Giảng dạy dễ hiểu">
                        <span class="mode-icon">👩‍🏫</span> Teacher
                    </button>
                    <button class="mode-btn" data-mode="student" title="Hỗ trợ học tập">
                        <span class="mode-icon">🎓</span> Student
                    </button>
                    <button class="mode-btn" id="tempModeBtn" title="Chat tạm — không lưu, mới hoàn toàn" style="border-color:var(--text-muted)">
                        <span class="mode-icon">🔒</span> Tạm
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Install banner -->
    <div id="installBanner" style="display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #dc2626;border-radius:16px;padding:16px 24px;box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:9999;display:none;align-items:center;gap:12px;font-family:Inter,sans-serif;max-width:400px">
        <img src="/static/icons/icon-192.png" style="width:40px;height:40px;border-radius:10px">
        <div style="flex:1">
            <div style="font-weight:700;font-size:15px;color:#1a1a1a">Cài đặt SbayAI</div>
            <div style="font-size:13px;color:#888">Trải nghiệm nhanh hơn trên app</div>
        </div>
        <button id="installBtn" style="padding:10px 20px;background:#dc2626;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer">Cài đặt</button>
        <button id="installClose" style="background:none;border:none;color:#888;font-size:20px;cursor:pointer;padding:4px">&times;</button>
    </div>

    <script src="/static/js/markdown.js"></script>
    <script src="/static/js/sidebar.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/mygpts.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
    // Service Worker + PWA Install
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }

    let deferredPrompt = null;
    const banner = document.getElementById('installBanner');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Show banner after 3s
        setTimeout(() => { banner.style.display = 'flex'; }, 3000);
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const result = await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.style.display = 'none';
    });

    document.getElementById('installClose').addEventListener('click', () => {
        banner.style.display = 'none';
    });

    // iOS Safari: show manual install guide
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    if (isIOS && !isStandalone) {
        setTimeout(() => {
            banner.style.display = 'flex';
            document.getElementById('installBtn').textContent = 'Hướng dẫn';
            document.getElementById('installBtn').onclick = () => {
                alert('Để cài SbayAI trên iPhone/iPad:\\n\\n1. Nhấn nút Chia sẻ (hình vuông mũi tên lên)\\n2. Chọn "Thêm vào Màn hình chính"\\n3. Nhấn "Thêm"');
            };
        }, 5000);
    }
    // ===== Trợ lý nhắc nhở 30 phút (giờ hành chính 8h-17h) =====
    (function() {
        const INTERVAL = 30 * 60 * 1000; // 30 phút
        const TIPS = [
            "Bạn đã thử chế độ Ask chưa? AI sẽ hỏi ngược để hiểu bạn 100%!",
            "Mẹo: Nhấn Ctrl+N để tạo chat mới nhanh hơn",
            "Chế độ CEO giúp bạn ra quyết định kinh doanh chính xác",
            "Thử voice 2 chiều — nói chuyện trực tiếp với AI!",
            "Chế độ Content giúp viết bài marketing chuyên nghiệp",
            "Mời bạn bè dùng SbayAI — nhận 20% hoa hồng!",
            "Chế độ Fast trả lời cực ngắn — tiết kiệm thời gian",
            "Custom GPT: tạo AI riêng cho công việc của bạn",
            "Chế độ Teacher giảng dạy dễ hiểu từ cơ bản",
            "Nâng cấp Pro để chat 100 tin nhắn/ngày!",
            "Chế độ Plan lập kế hoạch chi tiết với timeline",
            "Chế độ Student hỗ trợ giải bài tập + ôn thi",
        ];
        let tipIndex = 0;
        let reminderAudio = null;

        // Preload Sbay sound
        fetch('/api/tts?text=Sbay').then(r => r.blob()).then(b => {
            reminderAudio = new Audio(URL.createObjectURL(b));
            reminderAudio.volume = 0.5;
        }).catch(() => {});

        function isBusinessHours() {
            const h = new Date().getHours();
            // 8:00-11:59 sáng + 13:00-16:59 chiều (nghỉ trưa 12:00-12:59)
            return (h >= 8 && h < 12) || (h >= 13 && h < 17);
        }

        function showReminder() {
            if (!isBusinessHours()) return;

            // Phát âm thanh Sbay
            if (reminderAudio) {
                const sound = reminderAudio.cloneNode();
                sound.volume = 0.4;
                sound.play().catch(() => {});
            }

            // Hiện popup
            const tip = TIPS[tipIndex % TIPS.length];
            tipIndex++;

            const popup = document.createElement('div');
            popup.style.cssText = 'position:fixed;top:20px;right:20px;background:#fff;border:2px solid #dc2626;border-radius:16px;padding:16px 20px;box-shadow:0 8px 32px rgba(220,38,38,.15);z-index:99999;max-width:360px;animation:slideIn .3s ease;font-family:Inter,sans-serif';
            popup.innerHTML = `
                <div style="display:flex;align-items:start;gap:12px">
                    <img src="/static/icons/icon-192.png" style="width:36px;height:36px;border-radius:8px;flex-shrink:0">
                    <div style="flex:1">
                        <div style="font-weight:700;font-size:14px;color:#dc2626;margin-bottom:4px">SbayAI nhắc bạn</div>
                        <div style="font-size:13px;color:#333;line-height:1.5">${tip}</div>
                    </div>
                    <button onclick="this.closest('div[style]').parentElement.remove()" style="background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;padding:0;line-height:1">&times;</button>
                </div>
            `;
            document.body.appendChild(popup);

            // Tự đóng sau 10s
            setTimeout(() => { if (popup.parentElement) popup.remove(); }, 10000);
        }

        // Chạy mỗi 30 phút
        setInterval(showReminder, INTERVAL);
        // Nhắc lần đầu sau 5 phút
        setTimeout(showReminder, 5 * 60 * 1000);
    })();
    </script>
    <style>
    @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    </style>
</body>
</html>
