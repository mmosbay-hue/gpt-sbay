<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing — SbayAI</title>
    <style>
        :root { --bg:#0d1117; --bg2:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#19c37d; --border:#30363d; --success:#3fb950; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
        nav { display:flex; justify-content:space-between; align-items:center; padding:16px 48px; border-bottom:1px solid var(--border); }
        .logo { font-size:20px; font-weight:700; }
        nav a { color:var(--muted); font-size:14px; margin-left:16px; }
        .container { max-width:1000px; margin:0 auto; padding:80px 24px; text-align:center; }
        h1 { font-size:40px; margin-bottom:16px; }
        .subtitle { color:var(--muted); font-size:18px; margin-bottom:48px; }
        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
        .plan { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:32px; text-align:center; position:relative; transition:transform .2s, border-color .2s; }
        .plan:hover { transform:translateY(-4px); }
        .plan.pop { border-color:var(--accent); }
        .plan.pop::before { content:"MOST POPULAR"; position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; font-size:11px; font-weight:700; padding:4px 16px; border-radius:12px; }
        .plan-name { font-size:20px; font-weight:700; margin-bottom:8px; }
        .plan-price { font-size:48px; font-weight:800; margin:16px 0; }
        .plan-price small { font-size:16px; color:var(--muted); font-weight:400; }
        ul { list-style:none; text-align:left; margin:24px 0; }
        li { padding:10px 0; border-bottom:1px solid var(--border); color:var(--muted); font-size:14px; }
        li::before { content:"✓ "; color:var(--accent); font-weight:700; }
        .btn { display:block; width:100%; padding:14px; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; border:none; transition:all .2s; text-align:center; }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { background:#1a7f64; }
        .btn-outline { background:transparent; color:var(--text); border:1px solid var(--border); }
        .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
        .current { background:var(--border); color:var(--muted); cursor:default; }
        @media (max-width:768px) { .grid { grid-template-columns:1fr; } nav { padding:12px 16px; } }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">SbayAI</a>
        <div><a href="/chat">Chat</a><a href="/dashboard">Dashboard</a></div>
    </nav>
    <div class="container">
        <h1>Choose Your Plan</h1>
        <p class="subtitle">Start free, upgrade anytime. Cancel whenever.</p>
        <div class="grid" id="plans"></div>
    </div>
    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        const headers = token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } : {};

        async function loadPlans() {
            const res = await fetch('/api/billing/plans');
            const data = await res.json();
            const grid = document.getElementById('plans');

            grid.innerHTML = data.plans.map(p => {
                const isCurrent = user.plan === p.id;
                const btnClass = isCurrent ? 'current' : (p.popular ? 'btn-primary' : 'btn-outline');
                const btnText = isCurrent ? 'Current Plan' : (p.price === 0 ? 'Get Started' : `Upgrade — ${p.price.toLocaleString()}₫/mo`);

                return `<div class="plan ${p.popular ? 'pop' : ''}">
                    <div class="plan-name">${p.name}</div>
                    <div class="plan-price">${p.price.toLocaleString()}₫<small>/mo</small></div>
                    <ul>${p.features.map(f => `<li>${f}</li>`).join('')}</ul>
                    <button class="btn ${btnClass}" ${isCurrent ? 'disabled' : ''} onclick="upgrade('${p.id}')">${btnText}</button>
                </div>`;
            }).join('');
        }

        async function upgrade(plan) {
            if (!token) { window.location.href = '/register'; return; }
            if (plan === 'free' || plan === user.plan) return;

            try {
                const res = await fetch('/api/billing/upgrade', {
                    method: 'POST', headers,
                    body: JSON.stringify({ plan }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail);
                user.plan = plan;
                localStorage.setItem('user', JSON.stringify(user));
                alert(`Upgraded to ${plan}! ${data.price.toLocaleString()}₫/month`);
                loadPlans();
            } catch(e) { alert(e.message); }
        }

        loadPlans();
    </script>
</body>
</html>
