name: Auto deploy main to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: auto-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 103.159.52.102
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/www/wwwroot/gpt-clone' }}"
            VENV_PATH="${{ secrets.VENV_PATH || '/www/wwwroot/gpt-clone/venv' }}"
            SERVICE_NAME="${{ secrets.SERVICE_NAME || 'gpt-clone' }}"

            cd "$DEPLOY_PATH"

            # 1. Pull code mới
            git fetch origin main
            OLD_SHA=$(git rev-parse HEAD)
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)

            # 2. Chỉ cài lại deps khi requirements thay đổi
            if git diff --name-only "$OLD_SHA" "$NEW_SHA" | grep -qE '^(requirements\.txt|pyproject\.toml)$'; then
              echo ">> requirements thay đổi, cài lại deps..."
              "$VENV_PATH/bin/pip" install --upgrade pip
              "$VENV_PATH/bin/pip" install -r requirements.txt
            else
              echo ">> requirements không đổi, skip pip install."
            fi

            # 3. Chạy migration nếu có alembic
            if [ -f "alembic.ini" ]; then
              "$VENV_PATH/bin/alembic" upgrade head || true
            fi

            # 4. Restart service (pm2 hoặc systemd)
            if command -v pm2 >/dev/null 2>&1 && pm2 describe "$SERVICE_NAME" >/dev/null 2>&1; then
              pm2 restart "$SERVICE_NAME" --update-env
            elif systemctl list-unit-files | grep -q "^${SERVICE_NAME}.service"; then
              systemctl restart "$SERVICE_NAME"
            else
              echo "!! Không tìm thấy service $SERVICE_NAME. Bỏ qua restart."
            fi

            echo "Deployed: $(git rev-parse --short HEAD)"
